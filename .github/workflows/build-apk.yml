name: Build Android APK & Publish Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web app
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx cap sync android

      - name: Build & Sign Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            UNSIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          fi
          SIGNED_APK="../WAGuard-Maya-Admin.apk"

          # Generate signing keystore if not supplied via secrets
          keytool -genkey -v -keystore release.keystore -alias waguard \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass waguard123 -keypass waguard123 \
            -dname "CN=WAGuard Admin, OU=MayaSecurity, O=WAGuard, L=Dhaka, S=Dhaka, C=BD"

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign --ks release.keystore \
            --ks-key-alias waguard \
            --ks-pass pass:waguard123 \
            --key-pass pass:waguard123 \
            --out "$SIGNED_APK" \
            app-release-aligned.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAGuard-Maya-Admin-APK
          path: WAGuard-Maya-Admin.apk

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "WAGuard Maya Admin APK (${{ steps.release_tag.outputs.tag }})"
          body: |
            Automated Android APK release for **WAGuard — Maya AI & WhatsApp Server Admin Console**.

            ### Installation
            1. Download `WAGuard-Maya-Admin.apk` below.
            2. Install on your Android device (allow "Install from unknown sources" if prompted).
            3. Open the app and set your WAGuard Backend Server URL inside **Integrations** if connecting remotely.
          files: WAGuard-Maya-Admin.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
